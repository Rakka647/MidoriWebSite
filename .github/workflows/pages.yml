name: Deploy to GitHub Pages

# Lives next to deploy.yml on purpose: deploy.yml keeps the self-hosted server
# in sync, this one publishes the same dist/ to GitHub Pages (custom domain:
# midori.zone, configured in Settings -> Pages and mirrored by public/CNAME).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base 用相对路径 './'，这样同一份产物在两个地址下都能用：
      #   https://midori.zone/                        （自定义域名，根路径）
      #   https://rakka647.github.io/MidoriWebSite/   （项目站点，子路径）
      # 站点是 hash 路由，文档路径不会变，相对路径不会解析错。
      - run: npm run build
        env:
          SITE_BASE: ./

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
