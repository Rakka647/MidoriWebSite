name: Deploy to GitHub Pages

# Lives next to deploy.yml on purpose: deploy.yml keeps the self-hosted server
# in sync, this one publishes the same dist/ to GitHub Pages (custom domain:
# midori.zone, configured in Settings -> Pages and mirrored by public/CNAME).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages 项目站点跑在 /MidoriWebSite/ 子路径下，必须带 base 构建，
      # 否则 /assets/* 和图片都会 404。
      - run: npm run build
        env:
          SITE_BASE: /MidoriWebSite/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
