name: Deploy to server

# 推送到 main 时自动打包，并把 dist 同步到服务器；也可以在 GitHub 的 Actions 页面手动运行。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          # 去掉 Windows 换行符，并保证文件以换行结尾
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "私钥格式不对，请重新复制 SSH_KEY"; exit 1; }
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # 只传有变化的文件；--delete 会清掉服务器上已经不存在的旧文件
      - name: Sync dist to server
        run: |
          rsync -az --delete --chown=www:www \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/wwwroot/Midori.zone/"
